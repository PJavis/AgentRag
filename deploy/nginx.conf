# AgentRag — Nginx reverse proxy
# Front the Next.js frontend (port 3000) and the FastAPI API (port 8000)
# behind a single hostname. The Next.js app's built-in /api/* rewrites
# already proxy to INTERNAL_API_URL, so the browser only needs to talk
# to the frontend — but we expose /on/* and /admin and /images directly
# for clients that bypass the Next.js layer (e.g. curl, MCP).

upstream agentrag_api {
    server api:8000;
    keepalive 16;
}

upstream agentrag_frontend {
    server frontend:3000;
    keepalive 16;
}

# Set client_max_body_size globally so file uploads pass through.
client_max_body_size 100m;

server {
    listen 80;
    server_name _;

    # SSE / streaming: disable buffering and gzip on chat endpoints
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    gzip off;

    # Standard headers for upstream
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── API: open-notebook adapter ──────────────────────────────────────────
    location /on/ {
        proxy_pass http://agentrag_api;
        proxy_read_timeout 300s;
    }

    # ── Admin reasoning panel ───────────────────────────────────────────────
    location /admin {
        proxy_pass http://agentrag_api;
    }

    # ── Static images extracted from PDFs / standalone uploads ──────────────
    location /images/ {
        proxy_pass http://agentrag_api;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Native AgentRag endpoints (chat, ingest, search, etc.) ──────────────
    location ~ ^/(chat|ingest|search|documents|conversations|generate|metrics|health|config|mcp)(/|$) {
        proxy_pass http://agentrag_api;
        proxy_read_timeout 300s;
    }

    # ── Everything else → Next.js frontend ─────────────────────────────────
    location / {
        proxy_pass http://agentrag_frontend;
        proxy_read_timeout 60s;
    }
}
