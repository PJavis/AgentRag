# Text Embeddings Inference (TEI) — OpenAI-compatible embedding server.
# Serves the finetuned embedding model so AgentRag can hit it via
# EMBEDDING_PROVIDER=openai + EMBEDDING_BASE_URL=http://127.0.0.1:8080/v1/.
#
# Models are pulled from HF Hub on first start into the tei_hf_cache volume
# (one-time ~1.1GB download; survives restarts). For offline/local work,
# swap the volume for a bind mount and use --model-id=/data:
#   - ../models/agentrag-embed-v1:/data   (+ HF_HUB_OFFLINE=1)
#
# Start (GPU, 16 GB box):
#   docker compose -f deploy/tei.compose.yml --profile gpu up -d
#
# Start (CPU fallback, no GPU):
#   docker compose -f deploy/tei.compose.yml --profile cpu up -d
#
# Stop:
#   docker compose -f deploy/tei.compose.yml down

services:
  tei-gpu:
    profiles: ["gpu"]
    # cuda-1.9 = all-arch build (PTX), runs on Blackwell sm_120 (RTX 50xx) too.
    # The pinned :1.5 / :1.7 images are sm_80 only and fail on that GPU.
    # cuda-latest is NOT used: the 2026-04 build fails with
    # CUDA_ERROR_NO_DEVICE on Windows driver 621 (CUDA 13.5) under WSL and
    # silently falls back to CPU (~3 s per rerank instead of ~0.03 s).
    # cuda-1.9 JIT-compiles its PTX on every start (~4-5 min on sm_120). On an
    # RTX 50xx set TEI_IMAGE=ghcr.io/huggingface/text-embeddings-inference:120-1.9
    # in .env (native sm_120 build, ready in ~35 s).
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cuda-1.9}
    container_name: agentrag-tei
    ports:
      - "8080:80"
    volumes:
      # HF cache — hub downloads land here (TEI sets HUGGINGFACE_HUB_CACHE=/data).
      - tei_hf_cache:/data
    command:
      # Finetuned e5 (agentrag-embed-v1): MEAN pooling, 768-dim.
      - --model-id=dung6903/agentrag-embed-v1
      - --pooling=mean
      - --max-batch-tokens=16384
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    restart: unless-stopped

  tei-cpu:
    profiles: ["cpu"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: agentrag-tei
    ports:
      - "8080:80"
    volumes:
      - tei_hf_cache:/data
    command:
      # Same model as tei-gpu: the index holds 768-dim e5-FT vectors, so a
      # different model here (it used to be bge-m3, 1024-dim) breaks search.
      - --model-id=dung6903/agentrag-embed-v1
      - --pooling=mean
    restart: unless-stopped

volumes:
  tei_hf_cache:
