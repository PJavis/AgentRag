# Text Embeddings Inference (TEI) — OpenAI-compatible embedding server.
# Serves your finetuned embedding model so AgentRag can hit it via
# EMBEDDING_PROVIDER=openai + EMBEDDING_BASE_URL=http://127.0.0.1:8080/v1/.
#
# Start (GPU, 16 GB box):
#   docker compose -f deploy/tei.compose.yml --profile gpu up -d
#
# Start (CPU fallback, no GPU):
#   docker compose -f deploy/tei.compose.yml --profile cpu up -d
#
# Stop:
#   docker compose -f deploy/tei.compose.yml down

services:
  tei-gpu:
    profiles: ["gpu"]
    # cuda-latest = all-arch PTX build; required for Blackwell sm_120 (RTX 50xx).
    # The pinned :1.5 / :1.7 images are sm_80 only and fail on this GPU.
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-latest
    container_name: agentrag-tei
    ports:
      - "8080:80"
    volumes:
      # bge-m3 pre-downloaded on host (TEI 1.5 hf-hub downloader is broken in
      # this env). Run offline against the mounted dir. For the finetuned
      # checkpoint instead, mount ../models/agentrag-embed-v1:/data + --pooling=mean.
      - ../models/bge-m3:/data
    command:
      - --model-id=/data
      - --pooling=cls
      - --max-batch-tokens=16384
    environment:
      - HF_HUB_OFFLINE=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    restart: unless-stopped

  tei-cpu:
    profiles: ["cpu"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: agentrag-tei
    ports:
      - "8080:80"
    volumes:
      - ../models/bge-m3:/data
    command:
      - --model-id=/data
      - --pooling=cls
    environment:
      - HF_HUB_OFFLINE=1
    restart: unless-stopped
