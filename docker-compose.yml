services:
  postgres:
    image: postgres:16-alpine
    container_name: agentrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.15.0
    container_name: agentrag-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?pretty || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: agentrag-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── TEI: bge-m3 embeddings (OpenAI-compatible, :8080) ─────────────────────
  # Default service — starts with `docker compose up -d`. Needs NVIDIA GPU.
  # cuda-latest = all-arch PTX; required for Blackwell sm_120 (RTX 50xx).
  # bge-m3 auto-downloads from HF Hub into the tei_hf_cache volume on first
  # start (~2.2GB, one-time); local ./models/bge-m3 no longer needed for serving.
  # .env: EMBEDDING_PROVIDER=openai, EMBEDDING_BASE_URL=http://127.0.0.1:8080/v1/
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-latest
    container_name: agentrag-tei
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - tei_hf_cache:/data
    command:
      - --model-id=BAAI/bge-m3
      - --pooling=cls
      - --max-batch-tokens=16384
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # No healthcheck: the cuda-latest image has no curl/wget and its /bin/sh
    # lacks bash /dev/tcp, so any in-container probe false-fails. Readiness is
    # verified externally via GET :8080/health.

  # ── Ollama (profile: local-llm) ───────────────────────────────────────────
  # Yêu cầu: NVIDIA GPU + NVIDIA Container Toolkit
  # Cài toolkit: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
  #
  # Khởi động:
  #   docker compose --profile local-llm up -d
  #
  # Pull model sau khi container chạy:
  #   docker exec agentrag-ollama ollama pull qwen2.5:7b-instruct
  #   docker exec agentrag-ollama ollama pull nomic-embed-text
  #
  # .env khi dùng container Ollama:
  #   OLLAMA_BASE_URL=http://ollama:11434/v1/
  ollama:
    image: ollama/ollama:latest
    container_name: agentrag-ollama
    profiles: ["local-llm"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h          # giữ model trong VRAM 24h sau lần dùng cuối
      - OLLAMA_MAX_LOADED_MODELS=3     # 16GB VRAM: qwen2.5:7b + llava:7b + llama3.2:3b cùng lúc
    # GPU passthrough: dùng `deploy.resources` (legacy) HOẶC CDI (workaround
    # segfault của nvidia-container-toolkit trên WSL2). Nếu legacy bị segfault:
    #   1. sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    #   2. comment block deploy.resources bên dưới
    #   3. uncomment block runtime + devices bên dưới
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # ── CDI workaround (uncomment khi legacy segfault) ─────────────────────
    # runtime: nvidia
    # devices:
    #   - nvidia.com/gpu=all
    # ───────────────────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── App services (profile: app) ──────────────────────────────────────────
  # Bring up everything: docker compose --profile app up -d --build
  api:
    image: licht693/agentrag-api:latest
    build:
      context: .
      args:
        # Provenance stamped into the image. Empty is fine — the Dockerfile
        # still bakes a source hash, which is what detects a shadowed /app/src.
        GIT_SHA: ${GIT_SHA:-}
        BUILD_ID: ${BUILD_ID:-}
        BUILT_AT: ${BUILT_AT:-}
    container_name: agentrag-api
    profiles: ["app"]
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"   # in-network postgres listens on 5432 (the .env 5433 is the host-mapped port)
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://valkey:6379/0
      # GPU services (TEI embed + Ollama light tasks) run on the host → reach
      # them via the docker host gateway, not the .env 127.0.0.1 values.
      EMBEDDING_BASE_URL: http://host.docker.internal:8080/v1/
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1/
      # Self-hosted Langfuse is on the compose network (observability profile).
      LANGFUSE_HOST: http://langfuse:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - images_data:/app/data/images
      # Shared with worker: async graph_ingest/vision jobs run in the worker
      # container and must read the same files the api wrote. Originals (bind
      # mount → host, also feeds re-ingest of legacy docs) + parsed-content cache.
      - ./data/originals:/app/data/originals
      - structmem_cache:/app/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health 2>/dev/null || curl -f http://localhost:8000/on/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: licht693/agentrag-api:latest
    build:
      context: .
      args:
        # Provenance stamped into the image. Empty is fine — the Dockerfile
        # still bakes a source hash, which is what detects a shadowed /app/src.
        GIT_SHA: ${GIT_SHA:-}
        BUILD_ID: ${BUILD_ID:-}
        BUILT_AT: ${BUILT_AT:-}
    container_name: agentrag-worker
    profiles: ["app"]
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"   # in-network postgres port (.env 5433 is host-mapped)
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://valkey:6379/0
      EMBEDDING_BASE_URL: http://host.docker.internal:8080/v1/
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1/
      LANGFUSE_HOST: http://langfuse:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - images_data:/app/data/images
      # MUST match the api mounts — worker reads originals + parsed cache the api wrote.
      - ./data/originals:/app/data/originals
      - structmem_cache:/app/.cache
    command: ["arq", "src.agentrag.worker.settings.WorkerSettings"]

  frontend:
    image: licht693/agentrag-frontend:latest
    build:
      context: ./frontend
    container_name: agentrag-frontend
    profiles: ["app"]
    restart: unless-stopped
    environment:
      # Browser → API: same-origin via nginx proxy (or localhost dev)
      API_URL: http://localhost:8000/on
      # Server-side rewrites inside docker network
      INTERNAL_API_URL: http://api:8000/on
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

  # ── Langfuse LLM tracing (profile: observability) ─────────────────────────
  # Self-hosted Langfuse v2 + its own Postgres. Bring up with:
  #   docker compose --profile observability up -d
  # Keys are bootstrapped headlessly via LANGFUSE_INIT_* (see below) — no manual
  # UI signup needed. Copy the same public/secret keys into .env
  # (LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY), set LANGFUSE_ENABLED=true +
  # LANGFUSE_HOST=http://localhost:3000. Override the dev defaults for any shared
  # deployment.
  langfuse-db:
    image: postgres:16-alpine
    container_name: agentrag-langfuse-db
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    container_name: agentrag-langfuse
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      # Host 3002 (NOT 3000) — 3000 is the Next.js frontend's port. Langfuse UI
      # at http://localhost:3002. Set LANGFUSE_HOST=http://localhost:3002 in .env.
      - "3002:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3002
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme-langfuse-secret}
      SALT: ${LANGFUSE_SALT:-changeme-langfuse-salt}
      TELEMETRY_ENABLED: "false"
      # Headless bootstrap — creates org/project/user + fixed API keys on first
      # start so you can wire .env without the UI. Override for shared use.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-agentrag}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-agentrag}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-agentrag-dev}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-agentrag-dev}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@agentrag.local}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-changeme-langfuse-pw}

  # ── Arize Phoenix (profile: observability) ────────────────────────────────
  # Local trace + eval UI. Bring up with the observability profile, then set
  # PHOENIX_ENABLED=true in .env. UI at http://localhost:6006.
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: agentrag-phoenix
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "6006:6006"   # UI + OTLP HTTP collector
      - "4317:4317"   # OTLP gRPC collector
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix_data:/data

  nginx:
    image: nginx:1.27-alpine
    container_name: agentrag-nginx
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  es_data:
  valkey_data:
  tei_hf_cache:
  ollama_data:
  images_data:
  structmem_cache:
  langfuse_db_data:
  phoenix_data:
