services:
  postgres:
    image: postgres:16-alpine
    container_name: agentrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.15.0
    container_name: agentrag-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?pretty || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentrag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Ollama (profile: local-llm) ───────────────────────────────────────────
  # Yêu cầu: NVIDIA GPU + NVIDIA Container Toolkit
  # Cài toolkit: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
  #
  # Khởi động:
  #   docker compose --profile local-llm up -d
  #
  # Pull model sau khi container chạy:
  #   docker exec agentrag-ollama ollama pull qwen2.5:7b-instruct
  #   docker exec agentrag-ollama ollama pull nomic-embed-text
  #
  # .env khi dùng container Ollama:
  #   OLLAMA_BASE_URL=http://ollama:11434/v1/
  ollama:
    image: ollama/ollama:latest
    container_name: agentrag-ollama
    profiles: ["local-llm"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h          # giữ model trong VRAM 24h sau lần dùng cuối
      - OLLAMA_MAX_LOADED_MODELS=3     # 16GB VRAM: qwen2.5:7b + llava:7b + llama3.2:3b cùng lúc
    # GPU passthrough: dùng `deploy.resources` (legacy) HOẶC CDI (workaround
    # segfault của nvidia-container-toolkit trên WSL2). Nếu legacy bị segfault:
    #   1. sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    #   2. comment block deploy.resources bên dưới
    #   3. uncomment block runtime + devices bên dưới
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # ── CDI workaround (uncomment khi legacy segfault) ─────────────────────
    # runtime: nvidia
    # devices:
    #   - nvidia.com/gpu=all
    # ───────────────────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── App services (profile: app) ──────────────────────────────────────────
  # Bring up everything: docker compose --profile app up -d --build
  api:
    build:
      context: .
    container_name: agentrag-api
    profiles: ["app"]
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - images_data:/app/data/images
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health 2>/dev/null || curl -f http://localhost:8000/on/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
    container_name: agentrag-worker
    profiles: ["app"]
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - images_data:/app/data/images
    command: ["uv", "run", "arq", "src.agentrag.worker.settings.WorkerSettings"]

  frontend:
    build:
      context: ./frontend
    container_name: agentrag-frontend
    profiles: ["app"]
    restart: unless-stopped
    environment:
      # Browser → API: same-origin via nginx proxy (or localhost dev)
      API_URL: http://localhost:8000/on
      # Server-side rewrites inside docker network
      INTERNAL_API_URL: http://api:8000/on
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: agentrag-nginx
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  es_data:
  redis_data:
  ollama_data:
  images_data:
