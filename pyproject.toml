[project]
name = "agentrag"
version = "0.1.0"
description = "AgentRag — RAG agent with MCP server and CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=23.0.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    # Cache / task queue
    "redis>=5.0.0",
    "arq>=0.26.0",
    "cachetools>=5.3.0",
    # Search
    "elasticsearch==8.15.0",
    "tiktoken>=0.7.0",
    # LLM / Embedding
    "openai>=1.30.0",
    "huggingface-hub>=0.23.0",
    "sentence-transformers>=3.0.0",
    # Ingestion / Parsing
    "markitdown[all]>=0.1.0",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    # HTTP client (gemini embedder, reranker)
    "aiohttp>=3.9.0",
    # Config
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    # MCP server
    "mcp>=1.3.0",
    # CLI
    "typer[all]>=0.12.0",
    # Auth
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "httpx>=0.27.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Agent graph (langgraph backend, optional path)
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    # YAML ontology seeder + tests
    "pyyaml>=6.0",
    "pytesseract>=0.3.13",
    "mineru[all]>=3.1.14",
    # Audio transcription (Whisper) for mp3/wav/m4a ingest
    "faster-whisper>=1.0.3",
    "umap-learn>=0.5.6",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
# Langfuse LLM tracing (LANGFUSE_ENABLED=true). Pinned to v2 to match the
# single-container self-hosted server in docker-compose (profile=observability).
# v3+ SDK uses the OTEL ingestion endpoint, which needs a v3 server
# (clickhouse + redis + worker) — heavier than this project's lightweight setup.
observability = [
    "langfuse>=2.0.0,<3.0.0",
]
# DeepEval benchmark harness (scripts/eval/run_benchmark.py) + HF dataset loaders.
# DeepEval has no langchain dep → installs cleanly alongside langgraph/core 1.x.
deepeval = [
    "deepeval>=4.0.0",
    "datasets>=2.0.0",
    "google-genai>=0.3.0",   # required by deepeval GeminiModel judge
]
# Arize Phoenix — local trace + eval UI alongside Langfuse (profile=observability).
phoenix = [
    "arize-phoenix>=16.0.0",
    "openinference-instrumentation-openai>=0.1.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
# NOTE — RAGAS is intentionally NOT an extra here. It requires langchain-core
# <0.3, which conflicts with this project's langchain-core 1.x (via langgraph);
# they cannot share a venv. RAGAS scoring runs in an isolated env — see
# scripts/eval/score_ragas.py for the `uv run --no-project --with ragas` recipe.
# Step 1 (scripts/eval/run_ragas.py, this venv) only builds rows and needs no
# extra deps.

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests requiring a running API + Ollama",
]

[project.scripts]
agentrag = "agentrag.cli.app:main"
